plugins {
    id 'com.android.application'
}

// Release signing key: keystore.properties in the project root (never committed, see .gitignore)
// with storeFile, storePassword, keyAlias and keyPassword. Without it, release builds use the debug key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists())
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

android {
    compileSdk = 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        // Rattlegram Plus Plus: its own app ID so it installs alongside Rattlegram Plus
        applicationId "com.doodlecomms.rattlegramplusplus"
        minSdk 24        // Android 7.0 (API 24) minimum
        targetSdk 36
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -ffast-math -fno-exceptions -fno-rtti'
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            crunchPngs false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Fixed APK name for releases, so the permanent link
    // https://github.com/doodlecomms/Rattlegram_Plus-Plus/releases/latest/download/RattlegramPlusPlus.apk
    // always finds the newest version
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = variant.buildType.name == 'release' ? 'RattlegramPlusPlus.apk' : "RattlegramPlusPlus-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    namespace 'com.bi3bju.rattlegram_plus'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.9.0' // Required for EdgeToEdge
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0' // Password QR code: show and scan (Apache-2.0, includes ZXing core)
}